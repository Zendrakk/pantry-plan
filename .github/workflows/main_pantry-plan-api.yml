name: Build and deploy ASP.Net Core app to Azure Web App - pantry-plan-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build with dotnet
        run: dotnet build server/PantryPlan.Api.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish server/PantryPlan.Api.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v7
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v8
        with:
          name: .net-app
          path: ./published-app

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4326806B74E547E3AC3C5EC3EEBD384A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F2F08414A4DB49FDB69D7804695798DB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_00E23F2476CD4DDC9AE156148688091D }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'pantry-plan-api'
          slot-name: 'Production'
          package: ./published-app
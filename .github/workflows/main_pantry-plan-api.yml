name: Build and deploy ASP.Net Core app to Azure Web App - pantry-plan-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build with dotnet
        run: dotnet build server/PantryPlan.Api.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish server/PantryPlan.Api.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v6
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v7
        with:
          name: .net-app
          path: ./published-app

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_EAA449CFA3584CECABFE945C2761F8B3 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D49AEC87B5AC42339382FCCE3FA3DDC2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FFE4F2330A47422F91EEA81157943CEB }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'pantry-plan-api'
          slot-name: 'Production'
          package: ./published-app
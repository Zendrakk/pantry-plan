<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2F80C9"/>
      <stop offset="100%" stop-color="#1B5FA3"/>
    </linearGradient>
    <linearGradient id="shelfGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F3F1"/>
    </linearGradient>
    <linearGradient id="basketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8483C"/>
      <stop offset="100%" stop-color="#C33327"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="88" fill="url(#bg)"/>

  <!-- Subtle top highlight -->
  <rect width="512" height="256" rx="88" fill="#FFFFFF" opacity="0.04"/>

  <!-- Inner content scaled up to shrink the blue border -->
  <g transform="translate(-115.2,-115.2) scale(1.45)">
  <g transform="translate(1,0)">
    <rect x="96" y="96" width="320" height="320" rx="61" fill="url(#shelfGrad)"/>

    <!-- Middle shelf divider -->
    <rect x="96" y="290" width="320" height="14" fill="#D8DED9"/>

    <!-- Top shelf: grocery basket -->
    <g>
      <!-- Basket handle -->
      <path d="M186 200 C186 150 326 150 326 200" stroke="#C33327" stroke-width="10" stroke-linecap="round" fill="none"/>

      <!-- Items peeking above basket rim, pulled toward the center -->
      <g>
        <clipPath id="produceClip">
          <rect x="120" y="110" width="280" height="100"/>
        </clipPath>
        <g clip-path="url(#produceClip)">

          <!-- Bread loaf -->
          <g>
            <path d="M297 210 L297 188 Q297 168 316 168 Q335 168 335 188 L335 210 Z" fill="#D9A868" stroke="#B37F3F" stroke-width="2"/>
            <path d="M305 178 L314 189 M314 176 L323 189 M323 178 L331 189" stroke="#B37F3F" stroke-width="3" stroke-linecap="round"/>
          </g>

          <!-- Milk bottle -->
          <g>
            <rect x="231" y="155" width="38" height="55" rx="6" fill="#FFFFFF" stroke="#C7CDC8" stroke-width="2"/>
            <rect x="240" y="140" width="20" height="18" rx="4" fill="#FFFFFF" stroke="#C7CDC8" stroke-width="2"/>
            <rect x="242" y="131" width="16" height="11" rx="3" fill="#2F80C9"/>
            <rect x="231" y="178" width="38" height="13" fill="#BFE0F5"/>
          </g>

          <!-- Carrot (larger, buried deeper in the basket, about a third of the orange top visible) -->
          <g>
            <path d="M244 191 L284 191 L264 231 Z" fill="#F5921E"/>
            <path d="M264 191 L254 158 M264 191 L264 152 M264 191 L274 158" stroke="#4C9A4C" stroke-width="6" stroke-linecap="round"/>
          </g>

          <!-- Banana (shifted right slightly) -->
          <g transform="translate(15,0)">
            <path d="M162 152 C142 168 138 195 158 216 C172 230 195 224 202 205 C190 213 172 205 163 188 C157 176 158 162 162 152 Z" fill="#F2C230" stroke="#C99A1B" stroke-width="1.5"/>
            <path d="M160 152 C158 148 160 144 164 143" stroke="#6B4A1A" stroke-width="4" stroke-linecap="round" fill="none"/>
          </g>

          <!-- Apple (nudged right, still overlapping the handle but closer to the milk) -->
          <g>
            <path d="M221 176 C204 176 194 191 196 207 C198 222 209 234 221 234 C233 234 244 222 246 207 C248 191 238 176 221 176 Z" fill="#E8483C"/>
            <path d="M221 176 C218 169 219 162 224 157" stroke="#7A4A2B" stroke-width="4" stroke-linecap="round" fill="none"/>
            <path d="M224 159 C231 154 238 156 241 161" fill="#4C9A4C"/>
          </g>

          <!-- Broccoli -->
          <g>
            <circle cx="292" cy="176" r="15" fill="#3F9142"/>
            <circle cx="306" cy="185" r="13" fill="#3F9142"/>
            <circle cx="300" cy="165" r="12" fill="#4CA750"/>
            <rect x="292" y="184" width="13" height="26" rx="6" fill="#CFE0B8"/>
          </g>

        </g>
      </g>

      <!-- Basket body -->
      <path d="M146 210 L366 210 L338 276 C336 280 332 282 328 282 L184 282 C180 282 176 280 174 276 Z" fill="url(#basketGrad)"/>

      <!-- Vent hole grid, recalculated to stay inside the tapered body -->
      <g fill="#A8281E" opacity="0.85">
        <rect x="166" y="228" width="20" height="8" rx="3"/>
        <rect x="196" y="228" width="20" height="8" rx="3"/>
        <rect x="226" y="228" width="20" height="8" rx="3"/>
        <rect x="256" y="228" width="20" height="8" rx="3"/>
        <rect x="286" y="228" width="20" height="8" rx="3"/>
        <rect x="316" y="228" width="20" height="8" rx="3"/>

        <rect x="174" y="248" width="18" height="8" rx="3"/>
        <rect x="202" y="248" width="18" height="8" rx="3"/>
        <rect x="230" y="248" width="18" height="8" rx="3"/>
        <rect x="258" y="248" width="18" height="8" rx="3"/>
        <rect x="286" y="248" width="18" height="8" rx="3"/>
        <rect x="314" y="248" width="18" height="8" rx="3"/>

        <rect x="185" y="268" width="14" height="8" rx="3"/>
        <rect x="209" y="268" width="14" height="8" rx="3"/>
        <rect x="233" y="268" width="14" height="8" rx="3"/>
        <rect x="257" y="268" width="14" height="8" rx="3"/>
        <rect x="281" y="268" width="14" height="8" rx="3"/>
        <rect x="305" y="268" width="14" height="8" rx="3"/>
      </g>

      <!-- Basket rim -->
      <rect x="140" y="204" width="232" height="12" rx="6" fill="#C33327"/>
    </g>

    <!-- Bottom shelf: checklist card (shopping list) -->
    <g>
      <rect x="126" y="310" width="260" height="96" rx="14" fill="#FFFFFF" stroke="#D8DED9" stroke-width="4"/>

      <!-- check row 1 -->
      <circle cx="154" cy="334" r="10" fill="#2F80C9"/>
      <path d="M149 334 L153 338 L160 330" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <rect x="174" y="328" width="166" height="12" rx="6" fill="#C7CDC8"/>

      <!-- check row 2 -->
      <circle cx="154" cy="364" r="10" fill="#2F80C9"/>
      <path d="M149 364 L153 368 L160 360" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <rect x="174" y="358" width="126" height="12" rx="6" fill="#C7CDC8"/>

      <!-- check row 3 (unchecked) -->
      <circle cx="154" cy="394" r="10" fill="none" stroke="#C7CDC8" stroke-width="3"/>
      <rect x="174" y="388" width="140" height="12" rx="6" fill="#E4E8E4"/>
    </g>
  </g>
  </g>
</svg>
